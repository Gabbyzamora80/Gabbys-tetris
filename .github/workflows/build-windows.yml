name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get v1.0 source
        uses: actions/checkout@v7.0.1
        with:
          ref: v1.0

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build the executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name gabbys-tetris-1.0-windows-x86_64 main.py

      - name: Create SHA-256 checksum
        run: |
          $file = "dist/gabbys-tetris-1.0-windows-x86_64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  gabbys-tetris-1.0-windows-x86_64.exe" | Out-File -Encoding ascii "dist/SHA256SUMS-windows.txt"

      - name: Add files to the v1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0 "dist/gabbys-tetris-1.0-windows-x86_64.exe" "dist/SHA256SUMS-windows.txt"
